name: tests

on:
  push:
    branches: [main]
  # GitHub's default events. Nothing below reads draft state; `hygiene.yml` does.
  pull_request:
  # A pushed branch measured without a pull request (#841): a branch whose
  # routing stops before the pull request runs nothing on push, and the
  # Windows leg's own `--durations` table and the `durations` job's
  # `test-durations` artifact are the only per-case figures for it.
  workflow_dispatch:

# A newer push to an open pull request cancels this workflow's run of the
# commit before it. Any other run takes a group of its own: a `push` to
# `main` is what `release-report` below reads for a release tag, and GitHub
# cancels an older pending run in a shared group whatever
# `cancel-in-progress` says.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    strategy:
      fail-fast: false
      matrix:
        # The whole suite, at the stated floor on every platform. A newer
        # Python is not run here: `arms-grammar` below runs
        # `tests/skills/test_arm_check.py`, whose node-type tables are known to
        # depend on the interpreter, at the versions it names. Whether any
        # other module's result depends on the interpreter has not been
        # measured.
        #
        # `timeout`: each leg's budget in minutes, by `questions.md` Q6's rule
        # (a) of work item 1791270165 -- 1.5 times the leg's slowest measured
        # job, rounded up to 5. GitHub fails a job that runs past it, so a
        # leg that grows names itself here rather than in a wait. The base is
        # the slowest of the runs measured,
        # because the same suite ran 1.2 times slower from one run to the
        # next and one shard ran 1.7 times slower than its siblings in one
        # run:
        #   ubuntu  9 m 43 s, run 38332345615 (6 m 20 s in 38335775781,
        #           9 m 03 s in 37469595104, 8 m 24 s in 37700567455,
        #           5 m 40 s to 7 m 58 s in three runs before them)   -> 15
        #   macOS, per shard: 8 m 29 s, group 3 of run 38332345615, on the
        #          durations file before #874 refreshed it (7 m 11 s to
        #          7 m 29 s on the refreshed file in 38335775781; 6 m 56 s
        #          in 37700567455, the first run of the three shards; the
        #          unsharded leg they replaced took 15 m 25 s to 20 m 52 s
        #          and ran under 35)                                  -> 15
        #   Windows, per shard: 12 m 42 s, group 4 of run 37576998008
        #          (12 m 15 s in 37577753583, 11 m 52 s in 37700567455,
        #          10 m 20 s to 11 m 27 s on the refreshed file in
        #          38335775781; 10 m 34 s in 37469595104; 5 m 38 s to
        #          10 m 03 s in the sharded run 37465328899)          -> 20
        include:
          - { os: ubuntu-latest, python: "3.12", timeout: 15 }
          # macOS in three shards (#864) and Windows in four (#841).
          # `pytest-split` divides the suite by each case's duration, read
          # from the committed `.test_durations`, so every shard collects the
          # whole suite and runs its own disjoint part, and a leg's parts are
          # the whole suite. A case missing from the file is given the average
          # and still runs in exactly one shard: a stale file unbalances the
          # shards and never drops a case. The file is measured on the Windows
          # leg and divides the macOS leg too, because every leg collects the
          # same cases -- 12,819 on each at 5623d728, in run 37580460950 -- so
          # group k of a count holds the same cases on both. Only each case's
          # price differs by system, and that is read off each leg's own jobs,
          # never off the file. Four is the smallest Windows count whose
          # slowest shard stays under 12 minutes on the figures of run
          # 37458654434 (7,530 s of cases, 1,974 s unsharded), with the
          # arithmetic in
          # `62161701:seal/specs/1791270165-the-windows-test-leg-is-measured-and-cut/phases/phase-3.md`.
          # Three is the smallest macOS count the same arithmetic puts under
          # 12 minutes on run 37577753583's 1,185 s of cases, with a factor
          # of 1.45 for the slowest group (the file gives three groups of
          # 2,513 s, 2,517 s and 2,505 s), in
          # `67694cba:seal/specs/1791384162-the-macos-test-leg-runs-in-shards/plan.md`.
          # Measured in run 37700567455: the slowest macOS shard took 6 m 56 s,
          # and the three ran 12,827 cases between them, ubuntu's count at
          # the same SHA. ubuntu stays one job.
          #
          # `store`: every Windows shard measures the file as it runs (#931).
          # `--store-durations --clean-durations` makes pytest-split write
          # exactly its own session's cases to `.test_durations`, which on a
          # shard is its group, so the four parts are the whole suite. The
          # step after the pytest line uploads each part, and the
          # `durations` job below unions them into the `test-durations`
          # artifact. The file is the Windows leg's, so only Windows stores.
          - { os: macos-latest, python: "3.12", split: "--splits 3 --group 1", timeout: 15 }
          - { os: macos-latest, python: "3.12", split: "--splits 3 --group 2", timeout: 15 }
          - { os: macos-latest, python: "3.12", split: "--splits 3 --group 3", timeout: 15 }
          - { os: windows-latest, python: "3.12", split: "--splits 4 --group 1", store: "--store-durations --clean-durations", timeout: 20 }
          - { os: windows-latest, python: "3.12", split: "--splits 4 --group 2", store: "--store-durations --clean-durations", timeout: 20 }
          - { os: windows-latest, python: "3.12", split: "--splits 4 --group 3", store: "--store-durations --clean-durations", timeout: 20 }
          - { os: windows-latest, python: "3.12", split: "--splits 4 --group 4", store: "--store-durations --clean-durations", timeout: 20 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      # Not shallow, so the tags come too. `tests/behaviour/test_release_hygiene.py`
      # reads this repository's `v*` tags to tell a shipped version from one
      # being cut, and a depth-1 checkout fetches no tag, so its cases fail on
      # a tree with nothing wrong in it.
      # `tests/text/test_ci_gives_the_checks_what_they_need.py` holds every job
      # that runs pytest to the whole history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # `-n auto`, because this suite is a process-spawn benchmark and not a
      # computation. Wrapping `subprocess.run` for one run counted 3,308 child
      # processes -- 2,962 of them `git` -- and 96% of the wall clock was spent
      # inside them. The spawn count does not vary by platform; the price of
      # one spawn does: 7ms on ubuntu, 22ms on macOS, 60ms on windows, where
      # there is no `fork`, Defender scans each new image, and `git` carries an
      # MSYS2 runtime per invocation. Those figures, and the windows leg's 198s
      # against ubuntu's 24s that they explained, are from the suite as it
      # stood then; by 2026-10-06 the windows job took 37-40 minutes. The
      # current per-case figures are each leg's own `--durations` table below,
      # recorded with their run ids in
      # `62161701:seal/specs/1791270165-the-windows-test-leg-is-measured-and-cut/phases/phase-1.md`.
      # Each test builds its own repository under `tmp_path`, or copies one a
      # session or module fixture built once in its own worker and only reads
      # (#841), so no test writes where another reads, the spawns can be run
      # several at a time, and the workers scale with whatever cores the
      # runner has rather than with a number written here.
      # markdown-it-py is the parser the suite's CommonMark oracle reads
      # (#667), pinned: `.github/scripts/run_tests.py#MARKDOWN_IT` is the one
      # place the version is chosen, and a case holds this line to it.
      # cmarkgfm is GitHub's renderer, which the table walker's oracle reads
      # (#647), pinned in `run_tests.py#CMARKGFM` and held to this line too.
      # pytest-split divides the Windows and macOS legs into their shards
      # (#841, #864), pinned in `run_tests.py#PYTEST_SPLIT` and held to this
      # line the same way.
      - run: pip install pytest pytest-xdist markdown-it-py==4.2.0 cmarkgfm==2025.10.22 pytest-split==0.11.0
      - run: |
          git config --global user.email ci@ci
          git config --global user.name ci
      # `--durations=50`: each leg prints its own slowest cases, so a figure
      # for one operating system is read off that operating system (#841).
      # `-rfEs --no-fold-skipped`: each leg's short summary names every case
      # it skipped, with pytest's reason, beside every case that failed or
      # errored, so a row that defers a platform question to a leg is
      # answered by that leg's log (#1221). `-r` replaces pytest's default
      # `fE` rather than adding to it, so the default is written out; without
      # `--no-fold-skipped`, the cases one helper skips, such as every case
      # `tests/conftest.py#symlink_or_skip` skips, fold under the helper's
      # line and no case is named. The option needs pytest 8.3.0 or later.
      # `split` is empty on ubuntu, so that leg runs the whole suite as
      # before. `store` is empty everywhere but Windows, and it follows the
      # split because it is about the session the split leaves.
      - run: pytest tests/ -q -n auto --durations=50 -rfEs --no-fold-skipped ${{ matrix.split }} ${{ matrix.store }}
      # A shard's part, uploaded whether its cases passed or failed: a red
      # case still has a price. Only where `store` is set, because anywhere
      # else `.test_durations` is the committed file, and a part holding the
      # whole suite would read to the union as every id in two parts. The
      # name starts with a dot, which the action skips by default. A part is
      # kept as long as the union it makes: re-running failed jobs re-runs
      # the `durations` job too, which reads every part again, and the
      # re-run shard's part replaces the one its first attempt uploaded.
      - if: always() && matrix.store != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-durations-${{ strategy.job-index }}
          path: .test_durations
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The four Windows parts unioned into the file the next refresh commits
  # (#931). It runs after every pytest job, green or red, unless the run was
  # cancelled, and it is red whenever the parts cannot make the whole -- a
  # part missing, an id in two parts, a part that does not parse -- so no
  # smaller file is ever uploaded as the suite. Its summary reports each
  # shard's measured seconds, the spread, and the union against the
  # committed file. Downloading an artifact of the same run needs nothing
  # beyond the default token. `--count` is the number of entries above that
  # carry `store`.
  durations:
    needs: pytest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: test-durations-*
          path: parts
      - run: python .github/scripts/durations_union.py --parts parts --count 4 --committed .test_durations --out union/.test_durations
      - uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: union/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # `seal arms`'s node-type tables have to hold on every supported Python,
  # and whether they do depends on the interpreter reading them: 3.14 added
  # the t-string node types and removed five constant aliases, and the
  # `pytest` job above runs only the floor, so nothing unattended saw it
  # (#684). `ONLY_ON_SOME_PYTHONS` in `skills/verify/scripts/arm_check.py`
  # records which names only some Pythons have, and a case in the module
  # below refuses a bound of it, or the Python just below one, that no leg
  # here runs. A Python that changes
  # the grammar again is caught by adding its leg.
  arms-grammar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.13" }
          - { python: "3.14" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest tests/skills/test_arm_check.py -q

  # On a pull request into `main`, the release table: each agent's preload
  # bytes, the suite's seconds, each leg's minutes and each document's bytes
  # beside the same reading at the last release tag, appended to this job's
  # summary. It fails nothing, and whoever prepares the release reads it
  # (`docs/release-checklist.md` *5. The release pull request*);
  # `.github/scripts/release_report.py` is
  # the rule. The tag's minutes are its own commit's `tests` run on `main`.
  #
  # After the suite, whatever its verdict: a red leg still spent its minutes.
  # The token reads job lists and nothing else, declared here because this
  # workflow states no `permissions:` of its own. A `gh` call that finds no
  # run leaves its file empty, and the table reads that leg as no run found.
  release-report:
    needs: pytest
    if: ${{ !cancelled() && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the release against the last release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag=$(git describe --tags --abbrev=0 origin/main)
          mkdir "$RUNNER_TEMP/at"
          git archive "$tag" | tar -x -C "$RUNNER_TEMP/at"
          gh api "repos/$REPO/actions/runs/${{ github.run_id }}/jobs" \
            --paginate --jq '.jobs[]' > "$RUNNER_TEMP/jobs.jsonl" || true
          sha=$(git rev-list -n 1 "$tag")
          run=$(gh api "repos/$REPO/actions/workflows/test.yml/runs?head_sha=$sha&event=push" \
            --jq '.workflow_runs[0].id // empty' || true)
          : > "$RUNNER_TEMP/jobs-at.jsonl"
          if [ -n "$run" ]; then
            gh api "repos/$REPO/actions/runs/$run/jobs" \
              --paginate --jq '.jobs[]' > "$RUNNER_TEMP/jobs-at.jsonl" || true
          fi
          python .github/scripts/release_report.py --against "$tag" \
            --at "$RUNNER_TEMP/at" --ci-jobs "$RUNNER_TEMP/jobs.jsonl" \
            --ci-jobs-at "$RUNNER_TEMP/jobs-at.jsonl" >> "$GITHUB_STEP_SUMMARY"
