name: tests

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` and `converted_to_draft` are NOT in the default set
    # (`opened`, `synchronize`, `reopened`), and leaving them out made the
    # draft excuse a permanent way past every check below. Open the pull
    # request as a draft while a review is still running, let the checks pass
    # on the draft's terms, then press Ready for review: no commit follows, so
    # no `synchronize` fires, nothing re-runs, and the draft's green stays on
    # that SHA through the merge. Two clicks, no commit.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # A pushed branch measured without a pull request (#841): a branch whose
  # routing stops before the pull request runs nothing on push, and the
  # Windows leg's own `--durations` table is the only per-case figure for it.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  pytest:
    strategy:
      fail-fast: false
      matrix:
        # The whole suite, at the stated floor on every platform. A newer
        # Python is not run here: `arm-check-grammar` below runs
        # `tests/test_arm_check.py`, whose node-type tables are known to
        # depend on the interpreter, at the versions it names. Whether any
        # other module's result depends on the interpreter has not been
        # measured.
        #
        # `timeout`: each leg's budget in minutes, by `questions.md` Q6's rule
        # (a) of work item 1791270165 -- 1.5 times the leg's slowest measured
        # job, rounded up to 5. GitHub fails a job that runs past it, so a
        # leg that grows names itself here rather than in a wait. The base is
        # the slowest of the runs measured,
        # because the same suite ran 1.2 times slower from one run to the
        # next and one shard ran 1.7 times slower than its siblings in one
        # run:
        #   ubuntu  9 m 43 s, run 38332345615 (6 m 20 s in 38335775781,
        #           9 m 03 s in 37469595104, 8 m 24 s in 37700567455,
        #           5 m 40 s to 7 m 58 s in three runs before them)   -> 15
        #   macOS, per shard: 8 m 29 s, group 3 of run 38332345615, on the
        #          durations file before #874 refreshed it (7 m 11 s to
        #          7 m 29 s on the refreshed file in 38335775781; 6 m 56 s
        #          in 37700567455, the first run of the three shards; the
        #          unsharded leg they replaced took 15 m 25 s to 20 m 52 s
        #          and ran under 35)                                  -> 15
        #   Windows, per shard: 12 m 42 s, group 4 of run 37576998008
        #          (12 m 15 s in 37577753583, 11 m 52 s in 37700567455,
        #          10 m 20 s to 11 m 27 s on the refreshed file in
        #          38335775781; 10 m 34 s in 37469595104; 5 m 38 s to
        #          10 m 03 s in the sharded run 37465328899)          -> 20
        include:
          - { os: ubuntu-latest, python: "3.12", timeout: 15 }
          # macOS in three shards (#864) and Windows in four (#841).
          # `pytest-split` divides the suite by each case's duration, read
          # from the committed `.test_durations`, so every shard collects the
          # whole suite and runs its own disjoint part, and a leg's parts are
          # the whole suite. A case missing from the file is given the average
          # and still runs in exactly one shard: a stale file unbalances the
          # shards and never drops a case. The file is measured on the Windows
          # leg and divides the macOS leg too, because every leg collects the
          # same cases -- 12,819 on each at 5623d728, in run 37580460950 -- so
          # group k of a count holds the same cases on both. Only each case's
          # price differs by system, and that is read off each leg's own jobs,
          # never off the file. Four is the smallest Windows count whose
          # slowest shard stays under 12 minutes on the figures of run
          # 37458654434 (7,530 s of cases, 1,974 s unsharded), with the
          # arithmetic in
          # `seal/specs/1791270165-the-windows-test-leg-is-measured-and-cut/phases/phase-3.md`.
          # Three is the smallest macOS count the same arithmetic puts under
          # 12 minutes on run 37577753583's 1,185 s of cases, with a factor
          # of 1.45 for the slowest group (the file gives three groups of
          # 2,513 s, 2,517 s and 2,505 s), in
          # `seal/specs/1791384162-the-macos-test-leg-runs-in-shards/plan.md`.
          # Measured in run 37700567455: the slowest macOS shard took 6 m 56 s,
          # and the three ran 12,827 cases between them, ubuntu's count at
          # the same SHA. ubuntu stays one job.
          - { os: macos-latest, python: "3.12", split: "--splits 3 --group 1", timeout: 15 }
          - { os: macos-latest, python: "3.12", split: "--splits 3 --group 2", timeout: 15 }
          - { os: macos-latest, python: "3.12", split: "--splits 3 --group 3", timeout: 15 }
          - { os: windows-latest, python: "3.12", store: "--store-durations --clean-durations", timeout: 60 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      # Not shallow. `tests/test_a_rider_reaches_its_file.py` asks git whether
      # a recorded SHA is an ancestor of HEAD, and at depth 1 no SHA is: the
      # run went red on all four matrix legs for a reason that had nothing to
      # do with the code. A checkout that cannot answer the question is not a
      # pass either, so the test fails loudly on a shallow clone rather than
      # skipping.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # `-n auto`, because this suite is a process-spawn benchmark and not a
      # computation. Wrapping `subprocess.run` for one run counted 3,308 child
      # processes -- 2,962 of them `git` -- and 96% of the wall clock was spent
      # inside them. The spawn count does not vary by platform; the price of
      # one spawn does: 7ms on ubuntu, 22ms on macOS, 60ms on windows, where
      # there is no `fork`, Defender scans each new image, and `git` carries an
      # MSYS2 runtime per invocation. Those figures, and the windows leg's 198s
      # against ubuntu's 24s that they explained, are from the suite as it
      # stood then; by 2026-10-06 the windows job took 37-40 minutes. The
      # current per-case figures are each leg's own `--durations` table below,
      # recorded with their run ids in
      # `seal/specs/1791270165-the-windows-test-leg-is-measured-and-cut/phases/phase-1.md`.
      # Each test builds its own repository under `tmp_path`, or copies one a
      # session or module fixture built once in its own worker and only reads
      # (#841), so no test writes where another reads, the spawns can be run
      # several at a time, and the workers scale with whatever cores the
      # runner has rather than with a number written here.
      # markdown-it-py is the parser the suite's CommonMark oracle reads
      # (#667), pinned: `.github/scripts/run_tests.py#MARKDOWN_IT` is the one
      # place the version is chosen, and a case holds this line to it.
      # Pillow decodes the release seal in its pixel case (#718, #832),
      # pinned in `run_tests.py#PILLOW` and held to this line the same way, so
      # the pin runs on all three operating systems.
      # cmarkgfm is GitHub's renderer, which the table walker's oracle reads
      # (#647), pinned in `run_tests.py#CMARKGFM` and held to this line too.
      # pytest-split divides the Windows and macOS legs into their shards
      # (#841, #864), pinned in `run_tests.py#PYTEST_SPLIT` and held to this
      # line the same way.
      - run: pip install pytest pytest-xdist markdown-it-py==4.2.0 pillow==12.3.0 cmarkgfm==2025.10.22 pytest-split==0.11.0
      - run: |
          git config --global user.email ci@ci
          git config --global user.name ci
      # `--durations=50`: each leg prints its own slowest cases, so a figure
      # for one operating system is read off that operating system (#841).
      # `split` is empty on ubuntu, so that leg runs the whole suite as
      # before.
      - run: pytest tests/ -q -n auto --durations=50 ${{ matrix.split }} ${{ matrix.store }}
      - uses: actions/upload-artifact@v4
        if: always() && matrix.store != ''
        with:
          name: test-durations
          path: .test_durations
          include-hidden-files: true

  # `arm-check`'s node-type tables have to hold on every supported Python,
  # and whether they do depends on the interpreter reading them: 3.14 added
  # the t-string node types and removed five constant aliases, and the
  # `pytest` job above runs only the floor, so nothing unattended saw it
  # (#684). `ONLY_ON_SOME_PYTHONS` in `skills/verify/scripts/arm_check.py`
  # records which names only some Pythons have, and a case in the module
  # below refuses a bound of it, or the Python just below one, that no leg
  # here runs. A Python that changes
  # the grammar again is caught by adding its leg.
  arm-check-grammar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.13" }
          - { python: "3.14" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest tests/test_arm_check.py -q

  # The one measurement of the suite taken on every pull request: each leg's
  # minutes in this run, summed over its pytest jobs, held to the
  # `ci-minutes:*` rows of `seal/budgets.md`, with the billable line beside
  # them. A run's minutes swing from one run to the next on the same code, so
  # those rows are one-sided; `.github/scripts/budget_check.py` is the rule.
  #
  # After the suite, whatever its verdict: a red leg still spent its minutes.
  # The token reads the run's own job list and nothing else, declared here
  # because this workflow states no `permissions:` of its own.
  #
  # `fetch-depth: 0` is not for this job, which reads no history. It is what
  # `tests/test_ci_gives_the_checks_what_they_need.py` asks of a job whose
  # text names `pytest`, and `needs: pytest` does.
  budgets:
    needs: pytest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: each leg's minutes in this run, against its ceiling
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --paginate --jq '.jobs[]' > "$RUNNER_TEMP/jobs.jsonl"
          python .github/scripts/budget_check.py --ci-jobs "$RUNNER_TEMP/jobs.jsonl"
