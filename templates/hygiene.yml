# Pull-request checks for the SpecSeal workflow, run against what the pull
# request committed: the review chain's round record, and the `Mode` row of
# `seal/config.md`.
#
# Setup: `seal pr-checks install` writes this file to
# .github/workflows/hygiene.yml, at first setup under the answer "shared,
# with pull-request checks" or at any time later, and only when nothing is
# there yet; an existing file is never overwritten. It pins `v<version>`
# below to the plugin version installed at that moment, so the checks come
# from the release that wrote the file. The line moves when a person edits
# it, or runs `seal pr-checks remove` and then `seal pr-checks install`.
#
# Why it refuses in local mode: the checks read committed files
# (`chain_check.py` lists `seal/specs/` with `git ls-tree HEAD`), and local
# mode keeps the root under the git directory, where nothing is ever committed.
# `seal mode` moves the root and leaves this file alone, so a copy can stay
# after a switch to local. There every step examines nothing and passes: no
# `seal/` is in the tree, so nothing is declared, and a pull request that
# declares nothing owes nothing. `seal pr-checks remove` takes the copy out.
#
# Done by hand instead: a person copies this file to
# .github/workflows/hygiene.yml and replaces v<version> with the tag of the
# plugin release the repository runs.

name: hygiene

on:
  pull_request:
    # `ready_for_review` and `converted_to_draft` are not in the default set,
    # and without them a pull request opened as a draft keeps the green it
    # earned on the draft's terms: pressing Ready for review makes no commit,
    # so nothing re-runs. `chain_check.py` reads the draft state, and fails
    # an open finding, a record behind HEAD, or a missing `broad-gate.md` or
    # `guarantee.md` only once the draft is over.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the chain check diffs against the base branch

      # The checks ship with the plugin and load `hooks/routing.py` and
      # `hooks/optin.py` from beside themselves, so the plugin is cloned whole
      # rather than copied file by file, and outside the tree, so it is never
      # a commit candidate here either. `actions/checkout` refuses a path
      # outside the workspace, which is why this is a clone and not a step of
      # that action.
      - name: the plugin, at the release this file was written against
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch v<version> \
            https://github.com/MichaelYcJo/SpecSeal.git "$RUNNER_TEMP/specseal"

      # A work item routed "through the review chain" has to carry the round
      # record it claimed. A pull request that declared nothing fails only
      # where one of its own commits carries a `SpecSeal-Routing` trailer
      # naming a work item; a commit with no such trailer, a teammate's
      # among them, is not judged. On a pull request that is not a draft it
      # fails for what the author can fix: a trailer naming a work item no
      # judged declaration names, a declaration that says "through the review
      # chain" with no committed round record, a declaration that cannot be
      # read, a work item `spec.md` whose `## Rule changes` does not parse,
      # where the work item is judged or the pull request's own commits add
      # or change that `spec.md`, a round record of a work item reviewed
      # through the review chain, or the `guarantee.md` of one routed
      # straight to the pull request, with no `original:` line naming
      # `seal/parity.md`'s `Baseline commit`, where that config is declared
      # and the pull request changes a path outside `docs/` and `seal/`, a
      # finding still
      # `open` or one the check cannot read,
      # a last record behind HEAD or with a finding no round after it read,
      # no `broad-gate.md` at HEAD, or no `guarantee.md` reading `sealed` at
      # HEAD. A round's `target:` commit is read only as HEAD or an ancestor
      # of it, so the check needs no ref the checkout does not already
      # carry.
      - name: a declared review chain has the round record it claimed
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/specseal/skills/code-review/scripts/chain_check.py" \
            --baseline "origin/${{ github.base_ref }}"

      # `seal/config.md`'s `Mode` row is what this repository says its mode
      # should be; where the root actually sits is what it is. Nothing at
      # runtime reads the row, so it is the one thing here that can quietly
      # stop being true. This fails for a disagreement left standing (always
      # the author's, and always one command from fixed) and passes for an
      # absent row, which declares nothing.
      - name: the mode the row declares is the mode the folder is in
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/specseal/skills/implement/scripts/seal.py" \
            mode --check
