# The plugin's own Python, held to the tool it runs on other people's.
#
# lint-python only acts where a project has configured ruff, and until this
# file existed SpecSeal was not such a project: the hook that reformats your
# code on save was silent on the code that implements it.
#
# The selection is what a gate needs and no more. Rules whose "violation" is
# this codebase's deliberate posture are left out rather than suppressed
# line by line — the reasons are below, because an unexplained omission is
# indistinguishable from an oversight.
#
#   BLE001 (blind-except)   a hook that raises wedges the session; every gate
#       fails toward "not opted in", so a bare except IS the failure policy.
#   PLW1510 (subprocess-run-without-check)  not raising on a non-zero exit is
#       the intended behavior of a gate that reads returncode itself.
#   S110 / S112 (try-except-pass / -continue)  the same fail-open requirement,
#       expressed in a loop.
#
# Two selected families are switched off where they argue with a shape this
# code uses on purpose:
#
#   SIM105 (contextlib.suppress)  a gate's `except: pass` IS its failure
#       policy, and reads as one; suppress() hides it behind an import.
#   SIM102 (collapsible if)       a gate's outer condition asks whether it
#       applies and the inner asks whether it fires. One boolean loses that.

target-version = "py312"  # the floor hooks/launch.py holds
line-length = 88

# Snippets in skills and docs are illustrations, sometimes deliberately
# elided. Ruff formats Python inside Markdown, and letting it do so here turns
# a documentation edit into a lint failure over two spaces.
extend-exclude = ["*.md"]

# What runs before any floor is checked -- a hook, a git hook, the launcher,
# bin/test's runner, and every module one of them loads in its own process --
# runs on whatever `python3` starts it, and macOS ships 3.9 under that name.
# Linted at 3.9, B905 does not ask its `zip` for `strict=` (3.10) and UP017
# does not spell `timezone.utc` as `datetime.UTC` (3.11).
# tests/test_a_script_says_which_interpreter_it_needs.py derives that set,
# holds every file of it to this table, and refuses in each the syntax and the
# two constructs above that this version lacks; nothing runs it at 3.9.
[per-file-target-version]
"hooks/*.py" = "py39"  # its `*` crosses a `/`, so hooks/git/ too
".github/scripts/run_tests.py" = "py39"
"skills/verify/scripts/seal_stamp.py" = "py39"
"skills/code-review/scripts/chain_check.py" = "py39"
"skills/verify/scripts/unverified_check.py" = "py39"
"skills/settle/scripts/rule_changes.py" = "py39"

[lint]
select = ["E4", "E402", "E7", "E9", "F", "I", "B", "SIM", "UP", "RUF"]
ignore = ["SIM105", "SIM102"]

[lint.per-file-ignores]
# Fixtures build throwaway trees; a context manager per line buys nothing,
# and `git = lambda *a: ...` is the shortest honest spelling of a fixture helper.
"tests/*" = ["SIM115", "E731"]
